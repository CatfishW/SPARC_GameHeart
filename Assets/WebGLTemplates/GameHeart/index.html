<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0307">
  <meta name="description" content="Game Heart: Rhythm of Life. Keep the body's heartbeat in rhythm in a musical science adventure.">
  <title>Game Heart: Rhythm of Life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ff3d5e' d='M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z'/%3E%3C/svg%3E">
  <style>
    :root { --crimson:#ff3d5e; --coral:#ff8a80; --ink:#0a0307; }
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--ink); color:#fff;
      font-family: "Rajdhani", "Avenir Next", "Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none; touch-action:none; }
    #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
    #unity-canvas { width:100%; height:100%; display:block; background:#000; outline:none; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
      background: radial-gradient(ellipse at 50% 45%, #3a0816 0%, #14040a 45%, #050103 100%); transition: opacity .8s ease; z-index:5; }
    #loader.hidden { opacity:0; pointer-events:none; }
    .heart { width:96px; height:96px; filter: drop-shadow(0 0 22px rgba(255,61,94,.75)); animation: beat 1.1s infinite; }
    @keyframes beat { 0%,100%{transform:scale(1)} 12%{transform:scale(1.18)} 24%{transform:scale(1)} 36%{transform:scale(1.1)} 48%{transform:scale(1)} }
    .title { font-size: clamp(34px, 6vw, 72px); font-weight:800; letter-spacing:.12em; text-shadow: 0 0 24px rgba(255,61,94,.8); }
    .sub { margin-top:-14px; font-size: clamp(14px, 2vw, 22px); letter-spacing:.6em; color:var(--coral); }
    #ecg { width:min(560px, 80vw); height:70px; }
    #ecg path { fill:none; stroke:var(--crimson); stroke-width:3; filter: drop-shadow(0 0 6px rgba(255,61,94,.9)); }
    #pct { font-size:15px; letter-spacing:.35em; color:#d9c4cb; }
    #gate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:6; cursor:pointer;
      background: radial-gradient(ellipse at 50% 50%, rgba(40,6,16,.55), rgba(0,0,0,.85)); }
    #gate .card { text-align:center; padding:36px 56px; border:2px solid rgba(255,61,94,.7); border-radius:22px; background:rgba(12,4,8,.78);
      box-shadow: 0 0 40px rgba(255,61,94,.35); }
    #gate .go { font-size: clamp(26px, 4vw, 44px); font-weight:800; letter-spacing:.2em; }
    #gate .hint { margin-top:10px; color:#d9c4cb; letter-spacing:.2em; font-size:15px; }
    #fs { position:fixed; right:10px; bottom:10px; z-index:4; width:34px; height:34px; border-radius:9px; border:1px solid rgba(255,138,128,.45);
      background:rgba(10,3,7,.55); color:#ffd1d8; font-size:17px; cursor:pointer; opacity:0; transition: opacity .4s ease; }
    #fs.show { opacity:.6; }
    #fs:hover { opacity:1; }
    body.touch #fs { display:none; }
    #rotate { position:fixed; inset:0; display:none; z-index:7; background:#0a0307; align-items:center; justify-content:center; text-align:center;
      font-size:22px; letter-spacing:.1em; padding:30px; line-height:1.5; }
    @media (orientation: portrait) and (max-width: 820px) { body.touch #rotate { display:flex; } }
    #err { position:fixed; left:50%; top:20px; transform:translateX(-50%); z-index:9; display:none; background:#5a0d18; padding:12px 18px; border-radius:10px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="0" aria-label="Game Heart: Rhythm of Life. Use D F J K or tap the lanes."></canvas></div>
  <div id="loader">
    <svg class="heart" viewBox="0 0 64 64"><path fill="#ff3d5e" d="M32 56S6 40 6 22a13 13 0 0 1 26-4 13 13 0 0 1 26 4c0 18-26 34-26 34z"/></svg>
    <div class="title">GAME HEART</div>
    <div class="sub">RHYTHM OF LIFE</div>
    <svg id="ecg" viewBox="0 0 560 70" preserveAspectRatio="none"><path id="ecgPath" d=""/></svg>
    <div id="pct">SYNCING HEARTBEAT · 0%</div>
  </div>
  <div id="gate" role="button" aria-label="Start Game Heart" tabindex="0"><div class="card"><div class="go">♥ TAP TO START</div><div class="hint">HEADPHONES RECOMMENDED · SOUND ON</div></div></div>
  <button id="fs" title="Fullscreen" aria-label="Fullscreen">⤢</button>
  <div id="rotate">↻<br>Turn your device sideways<br>to keep the rhythm</div>
  <div id="err"></div>
  <script>
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
    var canvas = document.getElementById('unity-canvas');
    var pct = document.getElementById('pct');
    var ecgPath = document.getElementById('ecgPath');
    var progress = 0;
    function pqrst(x) { x = x - Math.floor(x); var y = 0;
      y += .10*Math.exp(-Math.pow((x-.18)/.035,2)); y -= .12*Math.exp(-Math.pow((x-.29)/.010,2));
      y += 1.0*Math.exp(-Math.pow((x-.31)/.012,2)); y -= .28*Math.exp(-Math.pow((x-.335)/.012,2));
      y += .22*Math.exp(-Math.pow((x-.52)/.05,2)); return y; }
    function drawEcg() {
      var n = 160, d = '', w = 560 * Math.max(0.03, progress);
      for (var i = 0; i < n; i++) { var x = i/(n-1)*w; var y = 52 - 44*pqrst(i/(n-1)*4.5*Math.max(progress,0.03));
        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
      ecgPath.setAttribute('d', d);
    }
    drawEcg();
    function showError(msg) { var e = document.getElementById('err'); e.textContent = msg; e.style.display = 'block'; }
    document.getElementById('fs').onclick = function () {
      var el = document.documentElement;
      if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
      else { (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document); }
    };
    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) { if (type === 'error') showError(msg); else console.warn(msg); },
    };
    var gate = document.getElementById('gate');
    var loader = document.createElement('script');
    loader.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    loader.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        progress = p; drawEcg();
        pct.textContent = 'SYNCING HEARTBEAT · ' + Math.round(p * 100) + '%';
      }).then(function (instance) {
        window.gameHeart = instance;
        progress = 1; drawEcg();
        var autostart = /[?&](qa|autostart)=/.test(location.search);
        document.getElementById('loader').classList.add('hidden');
        if (autostart) { canvas.focus(); return; }
        gate.style.display = 'flex';
        var go = function () { gate.style.display = 'none'; canvas.focus();
          if (document.body.classList.contains('touch')) {
            try { var el = document.documentElement; var rq = el.requestFullscreen || el.webkitRequestFullscreen;
              if (rq) { var pr = rq.call(el); if (pr && pr.then) pr.then(function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} }).catch(function () {}); } } catch (e) {}
          }
          try { var AC = window.AudioContext || window.webkitAudioContext; if (window.WEBAudio && WEBAudio.audioContext && WEBAudio.audioContext.state !== 'running') WEBAudio.audioContext.resume(); } catch (e) {} };
        gate.addEventListener('click', go); gate.addEventListener('touchend', function (e) { e.preventDefault(); go(); });
        gate.addEventListener('keydown', go);
        gate.focus();
      }).catch(function (msg) { showError(String(msg)); });
    };
    document.body.appendChild(loader);
    window.addEventListener('keydown', function (e) { if ([32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault(); }, { passive: false });
    // the fullscreen button appears only while the mouse moves, so it never sits on top of the game UI
    (function () { var fs = document.getElementById('fs'), t = null;
      window.addEventListener('mousemove', function () { fs.classList.add('show'); clearTimeout(t); t = setTimeout(function () { fs.classList.remove('show'); }, 2200); }); })();
  </script>
</body>
</html>
